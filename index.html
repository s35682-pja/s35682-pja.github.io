<!DOCTYPE html>

<style>
       /* Styl dla tła całej strony */
       body {
           background-color: black;
           margin: 0px;
           color: white;
           font-family: Arial, sans-serif;
       }
       /* Styl dla kontenera nagłówka */
       header {
           position: relative;
           width: 100%;
           height: 500px; /* Wysokość Twojego filmu na stronie */
           overflow: hidden;
           margin: 0px;
       }
       /* Styl dla rozmytego filmu w tle */
       .video-tlo {
           position: absolute;
           top: 50%;
           left: 50%;
           transform: translate(-50%, -50%) scale(1.1);
           min-width: 100%;
           min-height: 100%;
           object-fit: cover;
           z-index: 1;
           filter: blur(5px);
       }
       /* Styl dla menu nawigacyjnego na filmie */
       .menu-gorne {
           position: absolute;
           top: 30px;
           right: 0;
           text-align: right;
           padding-right: 50px;
           z-index: 10;
           width: 100%;
           
         

           
       }
       /* Styl dla samych linków w menu */
       .menu-link {
           color: white;
           text-decoration: none;
           text-transform: uppercase;
           font-size: 18px;
           font-family: 'Arial Black', Gadget, sans-serif;
           letter-spacing: 1px;
           transition: color 0.3s ease;
           margin: 0 12px;
           display: inline-block;
       }
       /* Efekt najechania myszką na link */
       .menu-link:hover {
           color: #ff0000; /* Kolor czerwony */
           cursor: pointer;
       }
       /* Styl dla kresek rozdzielających linki */
       .separator {
           color: white;
           font-size: 18px;
           font-family: 'Arial Black', Gadget, sans-serif;
       }
       /* Twoje pozostałe style dla dolnej części strony */
       .link {
           color: white;
           background-color: crimson;
           text-decoration: none;
           border: 2px solid black;
           border-radius: 5px;
           display: inline-block;
           margin: 20px;
           padding: 5px;
           transition-duration: 0.5s;
       }
       .link:hover {
           color: rgb(160, 0, 0);
           background-color: rgb(255, 198, 210);
           border-radius: 20px;
           transition-duration: 0.5s;
       }
       .text-panel {
           text-align: center;
           padding: 20px;
       }
</style>
</head>
