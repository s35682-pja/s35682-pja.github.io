<script>
function toggleMenu() {
    document.getElementById("mobileMenu").classList.toggle("active");
}

// Naprawiona funkcja - usunięto zdublowane ".style"
function openImage(src) {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = src;
}

function closeImage() {
    document.getElementById("lightbox").style.display = "none";
}

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const kafelki = entry.target.querySelectorAll('.kafelek');
            kafelki.forEach((kafelek, index) => {
                setTimeout(() => {
                    kafelek.classList.add('wlecial');
                }, index * 200);
            });
            observer.unobserve(entry.target);
        }
    });
}, { threshold: 0.3 });

observer.observe(document.getElementById('boxSection'));
</script>
